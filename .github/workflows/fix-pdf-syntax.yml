name: Fix PDF syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-pdf:
    if: ${{ !contains(github.event.head_commit.message, '[pdf-syntax-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix async PDF generator
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/pdf.js')
          s = p.read_text(encoding='utf-8')
          old = 'function genPDF(mod){'
          new = 'async function genPDF(mod){'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
          if git diff --quiet -- js/pdf.js; then
            echo 'No PDF syntax change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/pdf.js
          git commit -m 'Fix PDF generator syntax [pdf-syntax-fixed]'
          git push
