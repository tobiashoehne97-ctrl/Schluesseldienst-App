name: Fix index cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-index:
    if: ${{ !contains(github.event.head_commit.message, '[index-cache-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix index scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # This old script can create a fullscreen invisible click blocker.
          s = re.sub(r'<script\s+src=["\']js/calendar-overlay-fix-v1\.js[^>]*></script>', '', s, flags=re.I)
          # Replace any existing appInit cache query without depending on </script> matching.
          s, n = re.subn(r'js/appInit\.js(?:\?[^"\']*)?', 'js/appInit.js?v=20260914-24', s, count=1)
          if n == 0:
              raise SystemExit('appInit.js reference not found in index.html')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove blocking overlay and bust appInit cache [index-cache-fixed]'
          git push
